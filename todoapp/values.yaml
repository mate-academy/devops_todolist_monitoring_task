replicaCount: 2

image:
  repository: todoapp-metrics-test
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: secrets-reader

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: 256Mi
    cpu: 150m
  limits:
    memory: 256Mi
    cpu: 150m

env:
  PYTHONUNBUFFERED: "1"

secret:
  SECRET_KEY: dev-only-secret-key
  DB_NAME: app_db
  DB_USER: app_user
  DB_PASSWORD: "1234"
  DB_HOST: todoapp-mysql

database:
  enabled: true
  image: mysql:8.0
  rootPassword: "1234"
  user: app_user
  password: "1234"
  name: app_db
  storage: 2Gi

persistence:
  enabled: true
  size: 1Gi
  hostPath: /data/

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 10s
  path: /metrics/
  port: http
