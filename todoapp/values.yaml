replicaCount: 1

image:
  repository: todoapp
  tag: latest
  pullPolicy: Never

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podLabels: {}

service:
  type: ClusterIP
  port: 8080
  targetPort: 8080

serviceMonitor:
  enabled: true
  labels:
    release: kube-prometheus-stack
  interval: 10s
  path: /metrics
  port: http

env:
  DB_ENGINE: sqlite
  SECRET_KEY: changeme
  DB_NAME: /app/db.sqlite3
  DB_USER: ""
  DB_PASSWORD: ""
  DB_HOST: ""
