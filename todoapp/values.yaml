common:
  namespace: todoapp

todoapp:

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-statefulset-0.mysql-svc.mysql.svc.cluster.local"

  configmap:
    PYTHONUNBUFFERED: "1"

  deployment:

    port: 8080

    image:
      repo: killingrace/todoapp
      version: 3.0.4

    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "256Mi"
        cpu: "150m"

    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1

    affinity:
      weight: 1
      key: app
      operator: In
      values:
      - kube2py

    livenessProbe:
      path: api/health
      port: 8080
      initialDelaySeconds: 60
      periodSeconds: 5

    readinessProbe:
      path: api/ready
      port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5

  hpa:
    replicas:
      min: 2
      max: 5
    utilization:
      cpu: 70
      memory: 70

  pv:
    capacity: 1Gi
    path: /data/
    policy: Delete
    storageClassName: "standard"
    accessModes:
    - ReadWriteMany

  pvc:
    storage: 1Gi
    accessModes:
    - ReadWriteMany

  rbac:
    account:
      name: secrets-reader
    role:
      name: secrets-reader
      apiGroups: [""]
      resources: ["secrets"]
    roleBinding:
      name: secrets-reader-binding

  service:
    enabled: true
    tags:
      app: todoapp
      job: todoapp
    port:
      name: http
      protocol: TCP
      port: 8080
      targetPort: 8080

  serviceMonitor:
    jobLabel: job
    enabled: true
    labels: {app: todoapp}
    interval: 10s
    path: /metrics
    port: http