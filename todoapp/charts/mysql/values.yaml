common:
  namespace: mysql

mysql:

  secrets:
    MYSQL_ROOT_PASSWORD: '1234' # Base64 encoding for "1234"
    MYSQL_USER: app_user # Base64 encoding for "app_user"
    MYSQL_PASSWORD: '1234' # Base64 encoding for "1234"

  statefulset:
    replicas: 2

  image:
    repository: mysql
    version: '8.0'

  affinity:
    key: app
    values: mysql

  pvc:
    storage: 2Gi

  tolerations:
    key: app
    operator: Equal
    value: mysql
    effect: NoSchedule

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 1000m
      memory: 2Gi