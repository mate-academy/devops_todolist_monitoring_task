apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: todoapp
  labels:
    app: todoapp
spec:
  type: {{ .Values.service.type }}
  selector:
    app: todoapp
  ports:
    - name: app
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}

    - name: http
      protocol: TCP
      port: {{ .Values.service.metricsPort }}
      targetPort: http
