apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: {{ .Values.common.namespace }}
  labels:
    app: todoapp
spec:
  type: {{ .Values.service.type | default "ClusterIP" }}
  ports:
    - port: {{ .Values.service.port | default 80 }}
      targetPort: {{ .Values.service.targetPort | default 8080 }}
      protocol: TCP
      name: http
  selector:
    app: todoapp