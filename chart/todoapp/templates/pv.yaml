apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-data
spec:
  storageClassName: {{ .Values.persistence.storageClassName }}
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    - ReadWriteMany
  capacity:
    storage: {{ .Values.persistence.capacity }}
  hostPath:
    path: {{ .Values.persistence.hostPath }}
