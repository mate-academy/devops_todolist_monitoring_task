apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: {{ .Values.namespace }}
  labels:
    app: todoapp
    metrics: "true"
spec:
  type: ClusterIP
  selector:
    app: todoapp
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.clusterPort }}
    targetPort: http
---
{{- if .Values.service.nodePort.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: todoapp-nodeport
  namespace: {{ .Values.namespace }}
  labels:
    app: todoapp
spec:
  type: NodePort
  selector:
    app: todoapp
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.clusterPort }}
    targetPort: http
    nodePort: {{ .Values.service.nodePort.port }}
{{- end }}
