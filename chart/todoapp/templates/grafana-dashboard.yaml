{{- if .Values.grafanaDashboard.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: todoapp-grafana-dashboard
  namespace: {{ .Values.namespace }}
  labels:
    grafana_dashboard: "1"
data:
  todoapp.json: |
    {
      "title": "ToDo App HTTP Requests",
      "uid": "todoapp-http-requests",
      "timezone": "browser",
      "schemaVersion": 39,
      "refresh": "10s",
      "time": { "from": "now-30m", "to": "now" },
      "panels": [
        {
          "id": 1,
          "title": "Total HTTP Requests",
          "type": "timeseries",
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(http_requests_total[5m])) by (method)",
              "legendFormat": "{{ "{{" }} method {{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "HTTP Requests Creation Time",
          "type": "stat",
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 0 },
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "http_requests_created * 1000",
              "legendFormat": "{{ "{{" }} method {{ "}}" }}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "dateTimeAsIso" },
            "overrides": []
          },
          "options": {
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          }
        }
      ]
    }
{{- end }}
