namespace: todoapp
serviceAccountName: secrets-reader

replicaCount: 2

image:
  repository: todoapp
  tag: metrics
  pullPolicy: IfNotPresent

containerPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

config:
  PYTHONUNBUFFERED: "1"

secret:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

service:
  clusterPort: 80
  nodePort:
    enabled: true
    port: 30007

ingress:
  enabled: false

persistence:
  storageClassName: standard
  capacity: 1Gi
  hostPath: /data/

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 70

# ServiceMonitor for the kube-prometheus-stack Prometheus Operator to
# discover and scrape this app's /metrics endpoint.
serviceMonitor:
  enabled: true
  labels: {}
  interval: 10s
  path: /metrics
  port: http

# Provisions a Grafana dashboard (via the kube-prometheus-stack sidecar)
# with the two panels required by the task: request rate by method, and
# counter creation/reset time.
grafanaDashboard:
  enabled: true
