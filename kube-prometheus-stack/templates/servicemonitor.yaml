apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: mysql-servicemonitor
  namespace: mysql
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app: mysql
  endpoints:
    - port: mysql
      path: /metrics
      interval: 30s
  namespaceSelector:
    matchNames:
      - mysql