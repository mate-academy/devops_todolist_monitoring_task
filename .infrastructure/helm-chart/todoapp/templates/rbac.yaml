apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name | default .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Values.serviceAccount.name | default .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "watch", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.serviceAccount.name | default .Values.serviceAccountName }}-binding
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.serviceAccount.name | default .Values.serviceAccountName }}
  namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: {{ .Values.serviceAccount.name | default .Values.serviceAccountName }}
  apiGroup: rbac.authorization.k8s.io
