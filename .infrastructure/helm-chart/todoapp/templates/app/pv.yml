apiVersion: v1
kind: PersistentVolume
metadata:
  name: {{.Chart.Name}}-pv-data
  namespace: {{ .Values.namespaceName }}
spec:
  storageClassName: standard
  persistentVolumeReclaimPolicy: Delete
  accessModes:
    - ReadWriteMany
  capacity:
    storage: {{.Values.pv.capacity.storage | quote}}
  hostPath:
    path: /data/
