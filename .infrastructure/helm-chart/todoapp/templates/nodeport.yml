apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-{{ .Values.todoapp.names.todoappname }}-nodeport
  namespace: {{ .Values.todoapp.namespace.name}}
spec:
  type: NodePort
  selector:
    app: {{ .Values.todoapp.names.todoapp_label }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30007
