kind: ServiceAccount
apiVersion: v1
metadata:
  name: "{{ .Chart.Name }}-{{ .Values.rbac.serviceAccountName }}"
  namespace: {{ .Values.common.namespace }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.common.namespace }}
  name: "{{ .Chart.Name }}-{{ .Values.rbac.serviceAccountName }}"
rules:
{{- toYaml .Values.rbac.role.rules | nindent 2 }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: "{{ .Chart.Name }}-{{ .Values.rbac.serviceAccountName }}-binding"
  namespace: {{ .Values.common.namespace }}
subjects:
- kind: ServiceAccount
  name: "{{ .Chart.Name }}-{{ .Values.rbac.serviceAccountName }}"
roleRef:
  kind: Role
  name: "{{ .Chart.Name }}-{{ .Values.rbac.serviceAccountName }}"
  apiGroup: rbac.authorization.k8s.io