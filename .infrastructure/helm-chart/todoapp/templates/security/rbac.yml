kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{.Values.ServiceAccountName}}
  namespace: {{.Values.namespaceName}}

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{.Values.namespaceName}}
  name: secrets-reader
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-reader-binding
  namespace: {{.Values.namespaceName}}
subjects:
- kind: ServiceAccount
  name: {{.Values.ServiceAccountName}}
roleRef:
  kind: Role
  name: secrets-reader
  apiGroup: rbac.authorization.k8s.io