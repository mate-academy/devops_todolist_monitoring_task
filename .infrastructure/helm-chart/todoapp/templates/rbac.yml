{{- if .Values.todoapp.rbac.enabled }}
kind: ServiceAccount
apiVersion: v1
metadata:
  name: {{ .Values.todoapp.rbac.serviceAccountName }}
  namespace: {{ .Values.common.namespace }}

---

apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  namespace: {{ .Values.common.namespace }}
  name: {{ .Values.todoapp.rbac.Role.name }}
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["get", "watch", "list"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Values.todoapp.rbac.RoleBinding.name }}
  namespace: {{ .Values.common.namespace }}
subjects:
- kind: ServiceAccount
  name: {{ .Values.todoapp.rbac.serviceAccountName }}
roleRef:
  kind: Role
  name: {{ .Values.todoapp.rbac.Role.name }}
  apiGroup: rbac.authorization.k8s.io
{{ end }}