namespace: todoapp

replicaCount: 2

image:
  repository: todoapp
  tag: "monitoring"
  pullPolicy: IfNotPresent

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

secrets:
  SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-h!dpebxsz^dg47x)-k&kq_3zf*9e*"
  DB_NAME: "app_db"
  DB_USER: "app_user"
  DB_PASSWORD: "1234"
  DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

resources:
  requests:
    cpu: "150m"
    memory: "256Mi"
  limits:
    cpu: "150m"
    memory: "256Mi"

nodeAffinity:
  key: app
  values:
    - todoapp

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 1
        preference:
          matchExpressions:
            - key: app
              operator: In
              values:
                - todoapp

hpa:
  minReplicas: 2
  maxReplicas: 5
  cpuUtilization: 70
  memoryUtilization: 70

pv:
  capacity: 1Gi

pvc:
  storage: 1Gi

serviceAccount:
  name: todoapp-secrets-reader

serviceAccountName: todoapp-secrets-reader

service:
  port: 80
  targetPort: 8080
  nodePort: 30007

serviceMonitor:
  enabled: true
  labels: {}
  interval: 10s
  path: /metrics
  port: http

