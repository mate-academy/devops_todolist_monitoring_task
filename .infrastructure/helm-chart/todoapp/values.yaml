common:
  namespace: todoapp

todoapp:
  serviceAccountName: todoapp-secrets-reader

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  image:
    repository: volodymyrdv/todoapp
    tag: 4.0.0

  nodeAffinity:
    key: app
    values: todoapp

  hpa:
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

  pv:
    capacity:
      storage: 1Gi

  pvc:
    resources:
      requests:
        storage: 1Gi

roleBinding: todoapp-secrets-reader-binding

serviceMonitor:
  enabled: true
  labels: kube-prometheus-stack
  interval: 10s
  path: /metrics
  port: http