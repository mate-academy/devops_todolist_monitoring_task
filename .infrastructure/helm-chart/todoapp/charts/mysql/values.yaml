common:
  namespace: mysql

mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

  stateFulSet:
    replicas: 2

    image:
      repository: mysql
      tag: 8.0

    volumeClaimTemplates:
      storage: 2Gi

    affinity:
      key: app
      values: mysql

    tolerations:
      key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"

    resources:
      requests:
        cpu: 500m
        memory: 1Gi