common:
  namespace: mysql

secrets:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

statefulSet:
  replicas: 2
  image:
    repo: mysql
    tag: 8.0
  pvc:
    requests: 2Gi
  tolerations:
    key: "app"
    value: "mysql"
  affinity:
    key: "app"
    value: "mysql"
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
