namespace: mysql

mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"
    MYSQL_USER: "YXBwX3VzZXI=" # Base64 encoding for "app_user"
    MYSQL_PASSWORD: "MTIzNA==" # Base64 encoding for "1234"

replicas: 2

container:
  repository: mysql
  tag: 8.0

pvc_resources:
  storage: 2Gi

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: "app"
              operator: In
              values:
                - mysql
        topologyKey: "kubernetes.io/hostname"
#  nodeAffinity:
#    requiredDuringSchedulingIgnoredDuringExecution:
#      nodeSelectorTerms:
#        - matchExpressions:
#            - key: "app"
#              operator: In
#              values:
#                - "mysql"

resources:
  request:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: 500m
    memory: 1Gi