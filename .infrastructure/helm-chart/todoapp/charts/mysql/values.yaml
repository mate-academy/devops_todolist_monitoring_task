namespace:
  name: mysql

appname:
  name: mysql
  label: mysql

configs:
  MYSQL_ROOT_PASSWORD: "1234"
  MYSQL_USER: "app_user"
  MYSQL_PASSWORD: "1234"

image:
  name: mysql
  version: 8.0

replica:
  replicas: 2

affinity:
  podAntiAffinity:
    key: app
    operator: In
    values: mysql
  nodeAffinity:
    key: app
    operator: In
    values: mysql

tolerations:
  key: app
  operator: Equal
  value: mysql
  effect: NoSchedule

storage:
  storage: 2Gi