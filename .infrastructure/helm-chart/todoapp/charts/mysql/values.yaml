common:
  namespace: mysql

mysql:
  image:
    name: "mysql"
    repository: "mysql"
    version: "8.0"
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"
  statefulset:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi
    tolerations:
      key: "app"
      operator: "Equal"
      value: "mysql"
      effect: "NoSchedule"
    affinity:
      key: app
      operator: In
      values:
        - "mysql"
    volumeClaimTemplates:
      spec:
        resources:
          requests:
            storage: 2Gi