apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Chart.Name }}-config
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Chart.Name }}
data:
  init.sql: |
    CREATE DATABASE IF NOT EXISTS {{ .Values.secrets.MYSQL_DATABASE }};
    CREATE USER IF NOT EXISTS '{{ .Values.secrets.MYSQL_USER }}'@'%' IDENTIFIED BY '{{ .Values.secrets.MYSQL_PASSWORD }}';
    GRANT ALL PRIVILEGES ON {{ .Values.secrets.MYSQL_DATABASE }}.* TO '{{ .Values.secrets.MYSQL_USER }}'@'%';
    FLUSH PRIVILEGES;
    USE {{ .Values.secrets.MYSQL_DATABASE }};
    CREATE TABLE IF NOT EXISTS counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );
