apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{.Chart.Name}}-mysql-statefulset
  namespace: {{.Values.namespace}}
spec:
  selector:
    matchLabels:
      app: {{.Chart.Name}}-mysql
  replicas: {{.Values.replicas}}
  serviceName: {{.Chart.Name}}-mysql-service
  template:
    metadata:
      labels:
        app: {{.Chart.Name}}-mysql
    spec:
      containers:
      - name: mysql
        image: {{.Values.container.repository}}:{{.Values.container.tag}}
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-mysql-secrets
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_USER
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-mysql-secrets
              key: MYSQL_USER
        - name: MYSQL_PASSWORD
          valueFrom:
            secretKeyRef:
              name: {{.Chart.Name}}-mysql-secrets
              key: MYSQL_PASSWORD
        - name: MYSQL_DATABASE
          value: app_db
        ports:
        - name: mysql
          containerPort: 3306
        volumeMounts:
        - name: data
          mountPath: /var/lib/mysql
          subPath: mysql
        - name: config-map
          mountPath: /docker-entrypoint-initdb.d
        resources:
          requests:
            cpu: {{.Values.resources.request.cpu | quote}}
            memory: {{.Values.resources.request.memory | quote}}
          limits:
            cpu: {{.Values.resources.limits.cpu | quote}}
            memory: {{.Values.resources.limits.memory | quote}}
        livenessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          exec:
            command: ["mysqladmin", "ping"]
          initialDelaySeconds: 5
          periodSeconds: 2
          timeoutSeconds: 1
      volumes:
      - name: config-map
        configMap:
          name: {{.Chart.Name}}-config-mysql
      {{- with .Values.tolerations}}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end}}

      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: {{.Values.pvc_resources.storage}}
