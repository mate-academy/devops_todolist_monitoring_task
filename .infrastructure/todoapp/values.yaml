common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp:v2
    repository: diashockh/todoapp
    version: 4.0.1

  configs:
     PYTHONUNBUFFERED: "1"

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"

    resources:
      requests:
        memory: "256Mi"
        cpu: "150m"
      limits:
        memory: "256Mi"
        cpu: "150m"

    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 1
            preference:
              matchExpressions:
                - key: app
                  operator: In
                  values:
                    - todoapp
    hpa:
      minReplicas: 2
      maxReplicas: 5
      cpu:
        averageUtilization: 70
      memory:
        averageUtilization: 70

    capacity:
      storage: 1Gi

    pvc:
      resources:
        requests:
          storage: 1Gi

    serviceAccountName: secrets-reader

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

serviceMonitor:
  enabled: true
  labels: {}
  interval: 10s
  path: /metrics
  port: http
