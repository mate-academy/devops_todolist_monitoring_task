common:
  namespace: todoapp

todoapp:
  image:
    name: todoapp
    repository: orestprogrammer/todoapp
    version: 4.0.0

  config:
    PYTHONUNBUFFERED: "1"

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-0.mysql.mysql.svc.cluster.local"


  resources:
    requests:
      memory: "256Mi"
      cpu: "500m"
    limits:
      memory: "512Mi"
      cpu: "1"

  hpa:
    enabled: false
    minReplicas: 2
    maxReplicas: 4
    cpu:
      averageUtilization: 70
    memory:
      averageUtilization: 70

  serviceMonitor:
    enabled: true
    labels: {}
    interval: 10s
    path: /metrics
    port: http