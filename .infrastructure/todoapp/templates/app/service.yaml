apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-clusterip
  namespace: {{ .Values.common.namespace }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
  - protocol: TCP
    port: 80
    targetPort: 8080

---

apiVersion: v1
kind: Service
metadata:
  name: {{ .Chart.Name }}-nodeport
  namespace: {{ .Values.common.namespace }}
  labels:
    app: {{ .Chart.Name }}
    job: {{ .Chart.Name }}
    release: prometheus
spec:
  type: NodePort
  selector:
    app: {{ .Chart.Name }}
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
    nodePort: 30007
