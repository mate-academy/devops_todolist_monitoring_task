apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: {{ .Values.namespace }}
  labels:
    app: todoapp
spec:
  type: ClusterIP
  selector:
    app: todoapp
  ports:
  - name: http
    protocol: TCP
    port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}