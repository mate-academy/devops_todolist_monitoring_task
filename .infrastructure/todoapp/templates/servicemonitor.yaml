apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todoapp-monitor
  namespace: {{ .Values.common.namespace }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: todoapp
  endpoints:
    - port: {{ .Values.servicemonitor.port }}
      path: {{ .Values.servicemonitor.path }}
      interval: {{ .Values.servicemonitor.interval }}