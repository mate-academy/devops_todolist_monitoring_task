apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: todoapp
  labels:
    app: todoapp
    monitoring: todoapp-metrics
spec:
  type: ClusterIP
  selector:
    app: todoapp
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  - name: metrics
    protocol: TCP
    port: 8080
    targetPort: 8080
