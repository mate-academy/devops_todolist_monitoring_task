apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: todoapp
  namespace: todoapp
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      monitoring: todoapp-metrics
  namespaceSelector:
    matchNames:
    - todoapp
  endpoints:
  - port: metrics
    path: /metrics
    interval: 10s
