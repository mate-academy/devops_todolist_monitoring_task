apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: {{ .Values.common.namespace }}
  labels:
    job: {{ .Chart.Name }}-job
    app: {{ .Chart.Name }}
spec:
  type: ClusterIP
  selector:
    app: {{ .Chart.Name }}
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080