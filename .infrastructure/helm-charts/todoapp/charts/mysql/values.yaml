common:
  namespace: mysql

mysql:
  secrets:
    MYSQL_ROOT_PASSWORD: "1234"
    MYSQL_USER: "app_user"
    MYSQL_PASSWORD: "1234"

  statefulset:
    replicas: 2
    resources:
      requests:
        cpu: 500m
        memory: 1Gi

  image:
    repository: mysql
    version: 8.0

  tolerations:
    key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"

  affinity:
    antiAffinity:
      key: "app"
      operator: In
      values:
      - mysql
    nodeAffinity:
      key: "app"
      operator: In
      values:
      - mysql

  volumeClaim:
    requests:
      storage: 2Gi
