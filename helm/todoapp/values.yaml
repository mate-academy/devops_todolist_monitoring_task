namespace: todoapp

replicaCount: 2

image:
  repository: todoapp
  tag: metrics
  pullPolicy: IfNotPresent

serviceAccountName: secrets-reader

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

resources:
  requests:
    memory: "256Mi"
    cpu: "150m"
  limits:
    memory: "256Mi"
    cpu: "150m"

hpa:
  enabled: true
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 70

serviceMonitor:
  enabled: true
  # kube-prometheus-stack's Prometheus only picks up ServiceMonitors carrying
  # this release label (serviceMonitorSelectorNilUsesHelmValues defaults to true)
  labels:
    release: kube-prometheus-stack
  interval: 10s
  path: /metrics
  port: http
