apiVersion: v1
kind: Service
metadata:
  name: todoapp-service
  namespace: {{ .Release.Namespace }}
  labels:
    app: todoapp
spec:
  type: {{ .Values.service.type }}
  selector:
    app: todoapp
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.service.port }}
      targetPort: {{ .Values.service.targetPort }}
