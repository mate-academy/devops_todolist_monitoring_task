apiVersion: v1
kind: Secret
metadata:
  name: {{ include "todoapp.fullname" . }}-secret
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
type: Opaque
data:
  SECRET_KEY: {{ .Values.secrets.secretKey }}
  DB_NAME: {{ .Values.secrets.dbName }}
  DB_USER: {{ .Values.secrets.dbUser }}
  DB_PASSWORD: {{ .Values.secrets.dbPassword }}
  DB_HOST: {{ .Values.secrets.dbHost }}
