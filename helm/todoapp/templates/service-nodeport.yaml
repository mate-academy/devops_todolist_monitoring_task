{{- if .Values.nodePort.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: todoapp-nodeport
  namespace: {{ .Release.Namespace }}
  labels:
    app: todoapp
spec:
  type: NodePort
  selector:
    app: todoapp
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.nodePort.port }}
      targetPort: {{ .Values.nodePort.targetPort }}
      nodePort: {{ .Values.nodePort.nodePort }}
{{- end }}
