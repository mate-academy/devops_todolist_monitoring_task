# ─── Image ────────────────────────────────────────────────────────────────────
image:
  repository: mysql
  tag: "8.0"
  pullPolicy: IfNotPresent

# ─── Replicas ─────────────────────────────────────────────────────────────────
replicaCount: 2

# ─── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: "500m"
    memory: "1Gi"

# ─── Probes ───────────────────────────────────────────────────────────────────
livenessProbe:
  initialDelaySeconds: 30
  periodSeconds: 10
  timeoutSeconds: 5

readinessProbe:
  initialDelaySeconds: 5
  periodSeconds: 2
  timeoutSeconds: 1

# ─── PVC per pod ──────────────────────────────────────────────────────────────
volumeClaim:
  accessMode: ReadWriteOnce
  size: 2Gi

# ─── ConfigMap (init.sql) ────────────────────────────────────────────────────
configMap:
  init.sql: |
    GRANT ALL PRIVILEGES ON app_db.* TO 'app_user'@'%';
    USE app_db;
    CREATE TABLE counter (
        id INT AUTO_INCREMENT PRIMARY KEY,
        value INT
    );

# ─── Secret ───────────────────────────────────────────────────────────────────
secret:
  MYSQL_ROOT_PASSWORD: "MTIzNA=="
  MYSQL_USER: "YXBwX3VzZXI="
  MYSQL_PASSWORD: "MTIzNA=="

# ─── Affinity / Tolerations ──────────────────────────────────────────────────
affinity:
  podAntiAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      - labelSelector:
          matchExpressions:
            - key: app
              operator: In
              values:
                - mysql
        topologyKey: "kubernetes.io/hostname"
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
        - matchExpressions:
            - key: app
              operator: In
              values:
                - mysql

tolerations:
  - key: "app"
    operator: "Equal"
    value: "mysql"
    effect: "NoSchedule"
