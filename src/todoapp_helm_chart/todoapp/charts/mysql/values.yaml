namespace: mysql

mysql:
  image:
    name: "mysql"
    repository: "mysql"
    version: "8.0"

  secrets:
    MYSQL_DATABASE: "app_db" # Base64 encoding for "app_db"
    MYSQL_ROOT_PASSWORD: "1234" # Base64 encoding for "1234"
    MYSQL_USER: "app_user" # Base64 encoding for "app_user"
    MYSQL_PASSWORD: "1234" # Base64 encoding for "1234"EX

  replicas: 2

  pvc:
    requests:
      storage: "2Gi"

  podAntiAffinity:
    key: "app"
    values: mysql


  nodeAffinity:
    key: app
    values: mysql

  tolerations:
    key: "app"
    value: "mysql"


  resources:
    requests:
      cpu: 500m
      memory: 1Gi