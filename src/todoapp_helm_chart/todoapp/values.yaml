common:
  namespace: todoapp

todoapp:
  image:
    name: "todoapp"
    repository: "konstant1nou77/todoapp"
    version: "4.1.5"

  secrets:
    SECRET_KEY: "@e2(yx)v&tgh3_s=0yja-i!dpebxsz^dg47x)-k&kq_3zf*9e*"
    DB_NAME: "app_db"
    DB_USER: "app_user"
    DB_PASSWORD: "1234"
    DB_HOST: "mysql-statefulset-0.mysql-service.mysql.svc.cluster.local"

  resources:
    requests:
      memory: "256Mi"
      cpu: "150m"
    limits:
      memory: "256Mi"
      cpu: "150m"

  rollingUpdate:
    maxSurge: 1
    maxUnavailable: 1

  nodeAffinity:
    key: app
    values: todoapp

  hpa:
    minReplicas: 2
    maxReplicas: 5
  metrics:
    cpuUtilization: 70
    memoryUtilization: 70

  pv:
    capacity:
      storage: 1Gi

  pvc:
    requests:
      storage: "1Gi"

  serviceAccountName: my-service-account

  serviceMonitor:
    enabled: true
    labels: {}
    interval: 10s
    path: /metrics
    port: http
