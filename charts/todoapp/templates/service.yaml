apiVersion: v1
kind: Service
metadata:
  name: {{ include "todoapp.fullname" . }}
  labels:
    {{- include "todoapp.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}    # 8000
      targetPort: http                    # ім’я порту з Deployment
      protocol: TCP
  selector:
    {{- include "todoapp.selectorLabels" . | nindent 4 }}
