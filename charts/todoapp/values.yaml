# Default values for todoapp.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

image:
  repository: todoapp
  pullPolicy: IfNotPresent
  tag: "latest"

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Створювати окремий ServiceAccount для todoapp
  create: true
  # Автоматично монтувати токен
  automount: true
  # Додаткові анотації (якщо потрібні)
  annotations: {}
  # Ім'я SA (залишити пустим, щоб бралося з fullname)
  name: ""

podAnnotations: {}
podLabels: {}

podSecurityContext: {}
securityContext: {}

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

livenessProbe:
  httpGet:
    path: /
    port: http
readinessProbe:
  httpGet:
    path: /
    port: http

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80

volumes: []
volumeMounts: []

nodeSelector: {}
tolerations: []
affinity: {}

# Prometheus ServiceMonitor configuration
serviceMonitor:
  enabled: true
  # Додаткові лейбли до ServiceMonitor.metadata.labels
  labels: {}
  # Як часто Prometheus скрейпить (interval)
  interval: 10s
  # Шлях до метрик у вашому додатку
  path: /metrics
  # Ім'я порта, яке збігається з service.ports.name у templates/service.yaml
  port: http
